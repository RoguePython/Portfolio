<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cut Optimization Tool</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- Sidebar for Material and Cut Inputs -->
    <aside class="sidebar">
      <h2>Project Setup</h2>

      <section class="input-section">
        <h3>Materials</h3>
        <div id="materials-list"></div>
        <button id="add-material">+ Add Material</button>
      </section>

      <section class="input-section">
        <h3>Cut Requirements</h3>
        <div id="cuts-list"></div>
        <button id="add-cut">+ Add Cut</button>
      </section>

      <section class="input-section advanced-options">
        <h3>Advanced Options</h3>
        <label>Units:
          <select id="unit-select">
            <option value="mm">mm</option>
            <option value="cm">cm</option>
            <option value="inch">inch</option>
          </select>
        </label>
        <label>Kerf Width:
          <input type="number" id="kerf-width" value="0" />
        </label>
      </section>

      <button id="optimize-btn">Optimize Cuts</button>
    </aside>

    <!-- Main Canvas Area -->
    <main class="canvas-area">
      <h2>Cut Layout</h2>
      <div id="canvas-container">
        <!-- Canvas visuals rendered via JS -->
      </div>
    </main>

    <!-- Bottom Summary Bar -->
    <footer class="summary-bar">
      <div id="summary-results">
        <!-- Results will appear here -->
        <span id="total-waste"></span>
        <span id="material-used"></span>
      </div>
      <div>
        <button id="export-json">Export JSON</button>
        <button id="download-pdf">Download PDF</button>
      </div>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
