<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Minesweeper</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app" id="app">
      <header class="topbar">
        <a href="../" class="topbar__back" aria-label="Back to games menu">&larr; Games</a>
        <div class="brand">Minesweeper</div>
        <div class="stats">
          <span>Mines <strong id="minesVal">0</strong></span>
          <span>Time <strong id="timerVal">0:00</strong></span>
          <span>Best <strong id="bestVal">—</strong></span>
        </div>
      </header>

      <p id="controlsHint" class="hint" aria-live="polite">
        Left-click reveal · Right-click flag · Both buttons on a number to chord · Long-press to flag on touch · Esc to pause
      </p>

      <div class="board-wrap" id="boardWrap">
        <div id="board" class="board" role="grid" aria-label="Minesweeper board"></div>
      </div>

      <p id="statusMsg" class="status" role="status" aria-live="polite"></p>

      <!-- Settings overlay -->
      <div id="settingsOverlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
        <div class="overlay__panel">
          <h2 id="settingsTitle" class="overlay__title">Game Settings</h2>
          <form id="settingsForm" class="settings-form">
            <fieldset class="field">
              <legend>Difficulty</legend>
              <div class="radio-group">
                <label class="radio-label">
                  <input type="radio" name="difficulty" value="beginner" checked />
                  <span>Beginner <small>(9×9, 10 mines)</small></span>
                </label>
                <label class="radio-label">
                  <input type="radio" name="difficulty" value="intermediate" />
                  <span>Intermediate <small>(16×16, 40 mines)</small></span>
                </label>
                <label class="radio-label">
                  <input type="radio" name="difficulty" value="expert" />
                  <span>Expert <small>(30×16, 99 mines)</small></span>
                </label>
              </div>
            </fieldset>

            <fieldset class="field">
              <legend>Theme</legend>
              <div class="theme-group" id="themeGroup"></div>
            </fieldset>

            <button type="submit" class="btn btn--primary">Start Game</button>
          </form>
        </div>
      </div>

      <!-- Pause overlay -->
      <div id="pauseOverlay" class="overlay overlay--hidden overlay--board" role="dialog" aria-modal="true" aria-labelledby="pauseTitle" hidden>
        <div class="overlay__panel overlay__panel--compact">
          <h2 id="pauseTitle" class="overlay__title">Paused</h2>
          <p class="overlay__hint">Press <kbd>Esc</kbd> to resume</p>
          <div class="overlay__actions">
            <button type="button" id="resumeBtn" class="btn btn--primary">Resume</button>
            <button type="button" id="pauseSettingsBtn" class="btn">Settings</button>
          </div>
        </div>
      </div>

      <!-- Win overlay -->
      <div id="winOverlay" class="overlay overlay--hidden" role="dialog" aria-modal="true" aria-labelledby="winTitle" hidden>
        <div class="overlay__panel overlay__panel--compact">
          <h2 id="winTitle" class="overlay__title">You Win!</h2>
          <p class="overlay__score">Time: <strong id="finalTime">0:00</strong></p>
          <p id="newBestMsg" class="overlay__new-best" hidden>New best time!</p>
          <div class="overlay__actions">
            <button type="button" id="playAgainBtn" class="btn btn--primary">Play Again</button>
            <button type="button" id="settingsBtn" class="btn">Settings</button>
          </div>
        </div>
      </div>

      <!-- Lose overlay -->
      <div id="loseOverlay" class="overlay overlay--hidden" role="dialog" aria-modal="true" aria-labelledby="loseTitle" hidden>
        <div class="overlay__panel overlay__panel--compact">
          <h2 id="loseTitle" class="overlay__title">Game Over</h2>
          <p class="overlay__hint">You hit a mine.</p>
          <div class="overlay__actions">
            <button type="button" id="retryBtn" class="btn btn--primary">Play Again</button>
            <button type="button" id="loseSettingsBtn" class="btn">Settings</button>
          </div>
        </div>
      </div>
    </div>
    <script src="game.js"></script>
  </body>
</html>
